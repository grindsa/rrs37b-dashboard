# Shelly / Tapo / FSAPI / LEDVANCE device inventory — copy to
# config/smarthome.yml and set real LAN IPs (and Tuya keys for lamps).
#
#   cp config/smarthome.example.yml config/smarthome.yml
#
# Optional override path: SMARTHOME_CONFIG_FILE=/absolute/or/relative/path.yml
#
# Every Shelly device (cover, plug, meter) accepts an optional `password`
# (quoted string). Without it, SHELLY_RPC_PASSWORD from .env is used. Entries
# sharing an IP share one password. Generate one per device:
#   openssl rand -base64 15
# Lamp `local_key` values are Tuya secrets — never commit real keys.
# This file then holds secrets — keep it readable only by the deploy user and
# the container user.

# Groups are untyped floors/rooms (id + name). Devices declare membership with
# `group: <id>`. Each tab only shows groups that have matching devices:
#   covers → Rollos, lamps → Lampen, thermostats → Heizung.
# Fully empty groups are hidden everywhere they have no devices.
groups:
  - id: dg
    name: Dachgeschoss
  - id: og1
    name: 1. OG
  - id: eg
    name: Erdgeschoss
  - id: wohn
    name: Wohnbereich
  - id: flur
    name: Flur & Küche

# Covers for the Rollos section. `group` (required) must match a groups[].id.
# vendor: shelly (default) — Shelly 2PM; needs `ip` (+ optional coverId/password).
# vendor: gira — Gira System 3000 cover/timer (e.g. 536727) via gira-ble-api;
#   `id` must match the proxy covers[].id. Do not set ip/coverId/password.
covers:
  - id: dg-ost
    name: DG Ost
    ip: 192.168.0.101
    coverId: 0
    group: dg
    password: "change-me-dg-ost"
  - id: dg-west
    name: DG West
    ip: 192.168.0.102
    coverId: 0
    group: dg
  - id: og1-nord
    name: 1.OG Nord
    ip: 192.168.0.111
    coverId: 0
    group: og1
  - id: og1-sued
    name: 1.OG Süd
    ip: 192.168.0.112
    coverId: 0
    group: og1
  - id: eg-terrasse
    name: EG Terrasse
    ip: 192.168.0.121
    coverId: 0
    group: eg
  - id: eg-strasse
    name: EG Straße
    ip: 192.168.0.122
    coverId: 0
    group: eg
  - id: eg-living-blind
    name: Wohnzimmer Jalousie
    vendor: gira
    group: eg

# LEDVANCE Smart+ WiFi (Tuya local). `group` must match a groups[].id.
# Obtain device_id + local_key via tuya-cli wizard, tinytuya wizard, or a
# Ledvance/Smart+ key export script — keep Smart+ closed while controlling.
# Defaults: on_percent 100, protocol "3.5". dim_percent is optional —
# omit it to turn that lamp off when the group (or lamp) cycles to dim.
# DPs: 20 = on/off, 22 = brightness 10–1000 (percent mapped server-side).
lamps:
  - id: stehlampe
    name: Stehlampe
    ip: 192.168.0.210
    device_id: "bfxxxxxxxxxxxxxxxxxx"
    local_key: "change-me-local-key"
    group: wohn
    on_percent: 100
    dim_percent: 70
  - id: decke
    name: Decke
    ip: 192.168.0.211
    device_id: "bfyyyyyyyyyyyyyyyyyy"
    local_key: "change-me-local-key-2"
    group: wohn
    on_percent: 100
    dim_percent: 40
  - id: flur1
    name: Flur
    ip: 192.168.0.212
    device_id: "bfzzzzzzzzzzzzzzzzzz"
    local_key: "change-me-local-key-3"
    group: flur
    # no dim_percent → group dim turns this lamp off


# Plugs / power devices. `vendor` is shelly (default), tapo, or fsapi.
# Shelly uses `switchId` + optional `password` (else SHELLY_RPC_PASSWORD).
# Tapo uses TAPO_EMAIL / TAPO_PASSWORD from .env (local KLAP to `ip`); do not
# set `password` on Tapo entries.
# FSAPI (Frontier Silicon / UNDOK, e.g. Hama IR110): power on/off only via LAN
# HTTP. Optional `pin` (default "1234") and `port` (default 80). On the radio
# enable Keep network connected, or standby drops Wi‑Fi and remote power-on
# fails. Do not set Shelly `password` on FSAPI entries.
# `hidden: true` keeps a device out of the Smarthome tab — use it for Shelly
# BLE gateways only (Tapo/FSAPI cannot be a sensor gateway).
plugs:
  - id: plug-1
    name: Shelly Plug S
    ip: 192.168.0.130
    switchId: 0
  - id: tapo-1
    name: Tapo P100
    ip: 192.168.0.140
    vendor: tapo
  - id: radio-kueche
    name: Küchenradio
    vendor: fsapi
    ip: 192.168.0.150
    # pin: "1234"   # optional; NetRemote PIN
    # port: 80      # optional; some FS devices use 2244
  - id: gw-aussen-arbeit
    name: Gateway Außen/Arbeitszimmer
    ip: 192.168.0.10
    switchId: 0
    hidden: true
  - id: gw-wohnzimmer
    name: Gateway Wohnzimmer
    ip: 192.168.0.11
    switchId: 0
    hidden: true

# BLU H&T sensors. `label` is one of Aussen, Arbeitszimmer, Wohnzimmer;
# `gateway` must match a plug id. Get `mac` from GET /api/sensors/discover.
sensors:
  - label: Aussen
    gateway: gw-aussen-arbeit
    mac: aa:bb:cc:00:11:22
  - label: Arbeitszimmer
    gateway: gw-aussen-arbeit
    mac: aa:bb:cc:00:11:33
  - label: Wohnzimmer
    gateway: gw-wohnzimmer
    mac: aa:bb:cc:00:11:44

# Gira System 3000 thermostats (gira-ble-api). `id` must match the proxy.
# `group` may share any groups[].id (e.g. dg / og1 / eg). Optional `name`
# overrides the proxy label. Optional `group_primary: true` (at most one per
# group) shows that thermostat’s Ist on the collapsed Heizung group header.
# Live state comes from GIRA_BLE_API_URL.
thermostats:
  - id: dg-office
    name: Arbeitszimmer
    group: dg
    group_primary: true
  - id: og1-kids
    name: Kinderzimmer
    group: og1
  - id: eg-living
    name: Wohnzimmer
    group: eg
    group_primary: true

# Shelly Pro 3EM. The first meter is used for Hausverbrauch on the PV tab.
# If a Growatt NOAH uses this meter for Smart Self-Consumption, keep Shelly
# authentication off and set no password: the NOAH cannot log in, fails with
# "Set failed", and its retries lock the meter out for the dashboard too.
meters:
  - id: pro3em
    ip: 192.168.0.40
    emId: 0
