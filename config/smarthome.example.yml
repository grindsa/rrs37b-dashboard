# Shelly / Tapo / LEDVANCE device inventory — copy to config/smarthome.yml
# and set real LAN IPs (and Tuya keys for lamps).
#
#   cp config/smarthome.example.yml config/smarthome.yml
#
# Optional override path: SMARTHOME_CONFIG_FILE=/absolute/or/relative/path.yml
#
# Every Shelly device (cover, plug, meter) accepts an optional `password`
# (quoted string). Without it, SHELLY_RPC_PASSWORD from .env is used. Entries
# sharing an IP share one password. Generate one per device:
#   openssl rand -base64 15
# Lamp `local_key` values are Tuya secrets — never commit real keys.
# This file then holds secrets — keep it readable only by the deploy user and
# the container user.

# Groups shown in this order. Each group has a required `type`:
#   covers — roller shutters (list under `covers` with group: <id>)
#   lights — LEDVANCE / Tuya lamps (list under `lamps` with group: <id>)
# Empty groups (no matching devices) are hidden.
groups:
  - id: dg
    name: Dachgeschoss
    type: covers
  - id: og1
    name: 1. OG
    type: covers
  - id: eg
    name: Erdgeschoss
    type: covers
  - id: wohn
    name: Wohnbereich
    type: lights
  - id: flur
    name: Flur & Küche
    type: lights

# Shelly 2PM covers. `group` (required) must match a group with type: covers.
covers:
  - id: dg-ost
    name: DG Ost
    ip: 192.168.0.101
    coverId: 0
    group: dg
    password: "change-me-dg-ost"
  - id: dg-west
    name: DG West
    ip: 192.168.0.102
    coverId: 0
    group: dg
  - id: og1-nord
    name: 1.OG Nord
    ip: 192.168.0.111
    coverId: 0
    group: og1
  - id: og1-sued
    name: 1.OG Süd
    ip: 192.168.0.112
    coverId: 0
    group: og1
  - id: eg-terrasse
    name: EG Terrasse
    ip: 192.168.0.121
    coverId: 0
    group: eg
  - id: eg-strasse
    name: EG Straße
    ip: 192.168.0.122
    coverId: 0
    group: eg

# LEDVANCE Smart+ WiFi (Tuya local). `group` must match type: lights.
# Obtain device_id + local_key via tuya-cli wizard, tinytuya wizard, or a
# Ledvance/Smart+ key export script — keep Smart+ closed while controlling.
# Defaults: on_percent 100, protocol "3.5". dim_percent is optional —
# omit it to turn that lamp off when the group (or lamp) cycles to dim.
# DPs: 20 = on/off, 22 = brightness 10–1000 (percent mapped server-side).
lamps:
  - id: stehlampe
    name: Stehlampe
    ip: 192.168.0.210
    device_id: "bfxxxxxxxxxxxxxxxxxx"
    local_key: "change-me-local-key"
    group: wohn
    on_percent: 100
    dim_percent: 70
  - id: decke
    name: Decke
    ip: 192.168.0.211
    device_id: "bfyyyyyyyyyyyyyyyyyy"
    local_key: "change-me-local-key-2"
    group: wohn
    on_percent: 100
    dim_percent: 40
  - id: flur1
    name: Flur
    ip: 192.168.0.212
    device_id: "bfzzzzzzzzzzzzzzzzzz"
    local_key: "change-me-local-key-3"
    group: flur
    # no dim_percent → group dim turns this lamp off


# Plugs. `vendor` is shelly (default) or tapo. Shelly uses `switchId` + optional
# `password` (else SHELLY_RPC_PASSWORD). Tapo uses TAPO_EMAIL / TAPO_PASSWORD
# from .env (local KLAP to `ip`); do not set `password` on Tapo entries.
# `hidden: true` keeps a plug out of the Smarthome tab — use it for Shelly BLE
# gateways only (Tapo cannot be a sensor gateway).
plugs:
  - id: plug-1
    name: Shelly Plug S
    ip: 192.168.0.130
    switchId: 0
  - id: tapo-1
    name: Tapo P100
    ip: 192.168.0.140
    vendor: tapo
  - id: gw-aussen-arbeit
    name: Gateway Außen/Arbeitszimmer
    ip: 192.168.0.10
    switchId: 0
    hidden: true
  - id: gw-wohnzimmer
    name: Gateway Wohnzimmer
    ip: 192.168.0.11
    switchId: 0
    hidden: true

# BLU H&T sensors. `label` is one of Aussen, Arbeitszimmer, Wohnzimmer;
# `gateway` must match a plug id. Get `mac` from GET /api/sensors/discover.
sensors:
  - label: Aussen
    gateway: gw-aussen-arbeit
    mac: aa:bb:cc:00:11:22
  - label: Arbeitszimmer
    gateway: gw-aussen-arbeit
    mac: aa:bb:cc:00:11:33
  - label: Wohnzimmer
    gateway: gw-wohnzimmer
    mac: aa:bb:cc:00:11:44

# Shelly Pro 3EM. The first meter is used for Hausverbrauch on the PV tab.
# If a Growatt NOAH uses this meter for Smart Self-Consumption, keep Shelly
# authentication off and set no password: the NOAH cannot log in, fails with
# "Set failed", and its retries lock the meter out for the dashboard too.
meters:
  - id: pro3em
    ip: 192.168.0.40
    emId: 0
