# Broker for noah-mqtt → RRS37-Dashboard (Compose network `mqtt`, internal).
# Do not publish this listener to the public internet.
listener 1883
allow_anonymous false
# Both files are generated at container start (see docker-compose.yml):
# passwd from .env.mosquitto, acl copied from deploy/mosquitto/acl.
password_file /tmp/passwd
acl_file /tmp/acl
persistence false
connection_messages false
log_dest stdout
log_type error
log_type warning
