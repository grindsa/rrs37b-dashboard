# Broker for noah-mqtt → RRS37-Dashboard (Compose network `mqtt`, internal).
# Do not publish this listener to the public internet.
listener 1883
allow_anonymous false
# passwd is generated at container start (see docker-compose.yml) from
# .env.mosquitto. ACL is the bind-mounted file (must be readable by uid 1883).
password_file /tmp/passwd
acl_file /mosquitto/config/acl
persistence false
connection_messages false
log_dest stdout
log_type error
log_type warning
