services:
  rrs37-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: rrs37-dashboard:local
    container_name: rrs37-dashboard
    restart: unless-stopped
    # Reachable from the host reverse proxy as rrs37-dashboard:3000
    # on the shared external Docker network `proxy`.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - proxy
    expose:
      - "3000"

networks:
  proxy:
    external: true
