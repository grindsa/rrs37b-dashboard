services:
  rrs37-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: rrs37-dashboard:local
    container_name: rrs37-dashboard
    restart: unless-stopped
    # No host ports — reverse proxy on the same host reaches this
    # container via Docker network `rss37` as rrs37-dashboard:3000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - rss37
    expose:
      - "3000"

networks:
  rss37:
    name: rss37
