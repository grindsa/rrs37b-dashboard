services:
  rrs37-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-}
    image: rrs37-dashboard:local
    container_name: rrs37-dashboard
    restart: unless-stopped
    # Reachable from the host reverse proxy as rrs37-dashboard:3000
    # on the shared external Docker network `proxy`.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Live inventory on the host; example ships in the image as fallback.
      - SMARTHOME_CONFIG_FILE=/app/config/smarthome.yml
      # Read-only broker account (deploy/mosquitto/acl); password in .env.
      - NOAH_MQTT_USERNAME=dashboard
    volumes:
      - ./config:/app/config:ro
    # The app never writes to disk; Next.js may use .next/cache at runtime.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 256
    networks:
      - proxy
      - mqtt
      - egress
    expose:
      - "3000"

  # Optional Growatt bridge stack — enable with Compose profile `noah`
  # (deploy.sh enables it automatically when .env.noah sets GROWATT_USERNAME).
  mosquitto:
    profiles: ["noah"]
    # Pinned by digest; bump deliberately (tag kept for readability).
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: rrs37-mosquitto
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
    # Plaintext broker passwords, generated by deploy.sh from .env.noah / .env.
    env_file:
      - path: .env.mosquitto
        required: false
    # Hash the passwords into a private tmpfs file on every start, so no
    # password file has to be maintained on the host.
    command:
      - sh
      - -euc
      - |
        umask 077
        : "$${MOSQUITTO_NOAH_PASSWORD:?missing}" "$${MOSQUITTO_DASHBOARD_PASSWORD:?missing}"
        mosquitto_passwd -c -b /tmp/passwd noah "$$MOSQUITTO_NOAH_PASSWORD"
        mosquitto_passwd -b /tmp/passwd dashboard "$$MOSQUITTO_DASHBOARD_PASSWORD"
        cp /mosquitto/config/acl /tmp/acl
        unset MOSQUITTO_NOAH_PASSWORD MOSQUITTO_DASHBOARD_PASSWORD
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    # Started directly as the image's mosquitto user, so it needs no
    # capabilities to drop privileges; persistence is off, logs go to stdout.
    user: "1883:1883"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    # Internal network only: no egress, not published on the host.
    networks:
      - mqtt

  noah-mqtt:
    profiles: ["noah"]
    # Pinned by digest; it receives the Growatt credentials, so bump deliberately.
    image: ghcr.io/mtrossbach/noah-mqtt:0.0.29@sha256:a4f61777b82187da956b91495f64294c26da4fda02cc86549cec188a2d130876
    container_name: rrs37-noah-mqtt
    restart: unless-stopped
    # GROWATT_USERNAME / GROWATT_PASSWORD and MQTT_PASSWORD live only here,
    # never in .env, so the dashboard container never sees them.
    env_file:
      - path: .env.noah
        required: false
    environment:
      GROWATT_API_MODE: ${GROWATT_API_MODE:-web}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: noah
      # The broker ACL (deploy/mosquitto/acl) only covers this prefix.
      MQTT_TOPIC_PREFIX: noah2mqtt
      POLLING_INTERVAL: ${NOAH_POLLING_INTERVAL:-30}
      LOG_LEVEL: ${NOAH_LOG_LEVEL:-INFO}
    # Static binary on a scratch image, running as a non-root user; it never
    # writes to disk.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      - mosquitto
    # mqtt for the broker, egress for the Growatt cloud.
    networks:
      - mqtt
      - egress

networks:
  proxy:
    external: true
  # Broker traffic only; internal means no route out of the host.
  mqtt:
    internal: true
  egress:
    driver: bridge
