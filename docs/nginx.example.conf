# Example nginx vhost for https://rrs37b.mewes-im-netz.de
# Use when nginx runs in Docker on the same host and is attached to network `rss37`.
#
# Prerequisites:
# - App container `rrs37-dashboard` on network `rss37` (see docker-compose.yml)
# - This nginx container also joined to `rss37`
# - TLS certs (e.g. Let's Encrypt via certbot / your proxy stack)

upstream rrs37_dashboard {
    server rrs37-dashboard:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rrs37b.mewes-im-netz.de;

    # Redirect HTTP → HTTPS (adjust if using certbot's own redirect)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rrs37b.mewes-im-netz.de;

    # ssl_certificate     /etc/letsencrypt/live/rrs37b.mewes-im-netz.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rrs37b.mewes-im-netz.de/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Disable buffering so Next.js streaming works
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;

    location / {
        proxy_pass http://rrs37_dashboard;
    }
}
